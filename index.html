<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Axora AI – Pay Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        navy: {
                            950: '#060913',
                            900: '#0B1120',
                            800: '#111827',
                        },
                        electric: {
                            400: '#60A5FA',
                            500: '#3B82F6',
                            600: '#2563EB',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #060913;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.16) 0px, transparent 55%),
                radial-gradient(at 100% 100%, rgba(124, 58, 237, 0.14) 0px, transparent 55%);
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Remove number input spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .saas-shell {
            background: rgba(11, 17, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.7);
        }

        .result-card {
            background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 48%, #6d28d9 100%);
            box-shadow: 0 12px 30px -8px rgba(59, 130, 246, 0.45);
        }

        .input-box {
            transition: all 0.15s ease;
        }
        .input-box:focus-within {
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col items-center justify-center p-3 sm:p-4 select-none">

    <!-- Compact Single-Screen Mobile Container (Max 420px) -->
    <main class="w-full max-w-[400px] saas-shell rounded-3xl p-4 sm:p-5 flex flex-col gap-3.5 relative overflow-hidden">
        
        <!-- Top Accent Line -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-electric-500 via-indigo-500 to-purple-500"></div>

        <!-- 1. Minimalist Header -->
        <header class="flex items-center justify-between pt-0.5">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-electric-500 to-purple-600 flex items-center justify-center shadow-md border border-white/20">
                    <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-tight text-white leading-none">
                        Axora <span class="text-electric-400">AI</span>
                    </h1>
                    <p class="text-[11px] font-medium text-slate-400 mt-0.5">Instant Pay Calculator</p>
                </div>
            </div>

            <button 
                type="button" 
                id="resetBtn" 
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-200 bg-slate-800/90 hover:bg-slate-700 active:scale-95 border border-white/10 transition-all"
                title="Reset fields"
            >
                <svg class="w-3.5 h-3.5 text-electric-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Reset</span>
            </button>
        </header>

        <!-- 2. Prominent Blue-Purple Gradient Result Card (Always Visible at Top) -->
        <section class="result-card rounded-2xl p-4 text-white border border-white/20 relative overflow-hidden">
            <div class="flex items-center justify-between text-[11px] font-semibold uppercase tracking-wider text-blue-100/90">
                <span class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-300 animate-pulse"></span>
                    Total Payment
                </span>
                <span id="rateSummaryBadge" class="font-mono bg-black/25 px-2 py-0.5 rounded-md border border-white/10 text-[10px]">
                    ₹300/hr
                </span>
            </div>

            <!-- Main Calculated Amount -->
            <div id="totalPayDisplay" class="text-3xl sm:text-4xl font-extrabold font-mono tracking-tight my-1.5 truncate select-all">
                ₹0.00
            </div>

            <!-- Compact 1-Line Summary & Breakdown Pill -->
            <div class="flex items-center justify-between gap-2 bg-black/25 backdrop-blur-sm rounded-xl px-2.5 py-1.5 border border-white/10 text-[11px] font-mono">
                <span id="formulaDisplay" class="text-blue-100 truncate">₹300 × (0h + 0m/60)</span>
                <span id="durationBadge" class="shrink-0 font-bold text-emerald-300">0h 0m</span>
            </div>
        </section>

        <!-- Subtle Inline Warning (Hidden unless negative key pressed) -->
        <div id="warningBanner" class="hidden text-[11px] font-medium text-amber-300 bg-amber-500/10 border border-amber-500/30 rounded-xl px-3 py-1.5 text-center">
            Negative values are not allowed.
        </div>

        <!-- 3. Compact Input Controls -->
        <section class="flex flex-col gap-3">
            
            <!-- Hourly Pay Rate Input -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="rateInput" class="text-xs font-semibold text-slate-300">
                        Hourly Pay Rate
                    </label>
                    <span id="perMinText" class="text-[11px] font-mono text-slate-400">₹5.00 / min</span>
                </div>
                <div class="input-box flex items-center rounded-2xl bg-navy-950 border border-slate-700/80 overflow-hidden">
                    <span class="pl-3.5 pr-2.5 py-2.5 text-base font-bold text-electric-400 font-mono bg-slate-900/60 border-r border-slate-800">₹</span>
                    <input 
                        type="number" 
                        id="rateInput" 
                        value="300" 
                        min="0" 
                        step="any" 
                        inputmode="decimal"
                        placeholder="300"
                        class="w-full bg-transparent px-3 py-2.5 text-lg font-bold text-white font-mono placeholder-slate-600 focus:outline-none"
                    >
                    <span class="pr-3.5 text-[11px] font-bold text-slate-400 uppercase tracking-wider">/ HR</span>
                </div>
            </div>

            <!-- Side-by-Side Working Hours & Working Minutes (2-Column Grid for Zero Scroll) -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <span class="text-xs font-semibold text-slate-300">Working Duration</span>
                    <span id="decimalHoursText" class="text-[11px] font-mono text-electric-400">0.00 hrs total</span>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <!-- Hours Box -->
                    <div class="input-box flex flex-col rounded-2xl bg-navy-950 border border-slate-700/80 px-3 py-2">
                        <label for="hoursInput" class="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                            Hours
                        </label>
                        <div class="flex items-baseline justify-between mt-0.5">
                            <input 
                                type="number" 
                                id="hoursInput" 
                                min="0" 
                                step="any" 
                                inputmode="decimal"
                                placeholder="0"
                                class="w-full bg-transparent text-xl font-extrabold text-white font-mono placeholder-slate-600 focus:outline-none"
                            >
                            <span class="text-xs font-semibold text-electric-400 ml-1">hr</span>
                        </div>
                    </div>

                    <!-- Minutes Box -->
                    <div class="input-box flex flex-col rounded-2xl bg-navy-950 border border-slate-700/80 px-3 py-2">
                        <label for="minutesInput" class="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                            Minutes
                        </label>
                        <div class="flex items-baseline justify-between mt-0.5">
                            <input 
                                type="number" 
                                id="minutesInput" 
                                min="0" 
                                step="any" 
                                inputmode="decimal"
                                placeholder="0"
                                class="w-full bg-transparent text-xl font-extrabold text-white font-mono placeholder-slate-600 focus:outline-none"
                            >
                            <span class="text-xs font-semibold text-purple-400 ml-1">min</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Live Component Split Bar (Compact 2-pill breakdown) -->
            <div class="grid grid-cols-2 gap-2 pt-0.5">
                <div class="bg-slate-900/70 border border-white/5 rounded-xl px-3 py-1.5 flex items-center justify-between text-[11px]">
                    <span class="text-slate-400">Hours Pay:</span>
                    <span id="hoursPayText" class="font-mono font-semibold text-slate-200">₹0.00</span>
                </div>
                <div class="bg-slate-900/70 border border-white/5 rounded-xl px-3 py-1.5 flex items-center justify-between text-[11px]">
                    <span class="text-slate-400">Mins Pay:</span>
                    <span id="minsPayText" class="font-mono font-semibold text-slate-200">₹0.00</span>
                </div>
            </div>

            <!-- Bottom Clear Duration Button -->
            <button 
                type="button" 
                id="clearDurationBtn" 
                class="w-full py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700/90 active:scale-[0.99] border border-white/10 transition-all"
            >
                Clear Hours & Minutes
            </button>
        </section>

    </main>

    <script>
        (function () {
            'use strict';

            const DEFAULT_RATE = 300;

            const rateInput = document.getElementById('rateInput');
            const hoursInput = document.getElementById('hoursInput');
            const minutesInput = document.getElementById('minutesInput');

            const totalPayDisplay = document.getElementById('totalPayDisplay');
            const rateSummaryBadge = document.getElementById('rateSummaryBadge');
            const formulaDisplay = document.getElementById('formulaDisplay');
            const durationBadge = document.getElementById('durationBadge');
            const perMinText = document.getElementById('perMinText');
            const decimalHoursText = document.getElementById('decimalHoursText');
            const hoursPayText = document.getElementById('hoursPayText');
            const minsPayText = document.getElementById('minsPayText');
            const warningBanner = document.getElementById('warningBanner');

            const resetBtn = document.getElementById('resetBtn');
            const clearDurationBtn = document.getElementById('clearDurationBtn');

            const inrFormat = new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            const numFormat = new Intl.NumberFormat('en-IN', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });

            function formatINR(val) {
                if (!Number.isFinite(val) || val <= 0) return '₹0.00';
                return inrFormat.format(val);
            }

            function parseCleanPositive(inputEl) {
                const raw = inputEl.value.trim();
                if (raw === '') return 0;
                const num = parseFloat(raw);
                if (raw.includes('-') || num < 0) {
                    const pos = Math.abs(num) || 0;
                    inputEl.value = pos === 0 ? '' : pos;
                    showWarning();
                    return pos;
                }
                return Number.isFinite(num) && num >= 0 ? num : 0;
            }

            let warnTimeout;
            function showWarning() {
                warningBanner.classList.remove('hidden');
                clearTimeout(warnTimeout);
                warnTimeout = setTimeout(() => {
                    warningBanner.classList.add('hidden');
                }, 2200);
            }

            function calculate() {
                const rate = parseCleanPositive(rateInput);
                const hours = parseCleanPositive(hoursInput);
                const minutes = parseCleanPositive(minutesInput);

                // Formula: Payment = Hourly Rate × (Hours + Minutes / 60)
                const totalDecimalHours = hours + (minutes / 60);
                const totalPay = Math.round(((rate * totalDecimalHours) + Number.EPSILON) * 100) / 100;

                const hoursPay = rate * hours;
                const minsPay = rate * (minutes / 60);
                const totalMins = (hours * 60) + minutes;

                // Update Hero Result
                totalPayDisplay.textContent = formatINR(totalPay);
                rateSummaryBadge.textContent = `₹${numFormat.format(rate)}/hr`;
                perMinText.textContent = `${formatINR(rate / 60)} / min`;

                // Update Formula & Normalized Duration Pill
                formulaDisplay.textContent = `₹${numFormat.format(rate)} × (${numFormat.format(hours)}h + ${numFormat.format(minutes)}m/60)`;

                if (minutes >= 60) {
                    const normH = Math.floor(totalMins / 60);
                    const normM = +(totalMins % 60).toFixed(1);
                    durationBadge.textContent = `${normH}h ${normM}m`;
                } else {
                    durationBadge.textContent = `${numFormat.format(hours)}h ${numFormat.format(minutes)}m`;
                }

                // Update Sub-metrics
                decimalHoursText.textContent = `${numFormat.format(totalDecimalHours)} hrs (${numFormat.format(totalMins)}m)`;
                hoursPayText.textContent = formatINR(hoursPay);
                minsPayText.textContent = formatINR(minsPay);
            }

            // Live Input Listeners
            [rateInput, hoursInput, minutesInput].forEach(el => {
                el.addEventListener('input', calculate);
                el.addEventListener('keydown', function (e) {
                    if (e.key === '-' || e.key === 'e' || e.key === 'E') {
                        e.preventDefault();
                        if (e.key === '-') showWarning();
                    }
                });
            });

            // Clear Duration only (keeps current hourly rate)
            clearDurationBtn.addEventListener('click', function () {
                hoursInput.value = '';
                minutesInput.value = '';
                warningBanner.classList.add('hidden');
                calculate();
                hoursInput.focus();
            });

            // Full Reset (Rate -> 300, Hours & Minutes -> empty)
            resetBtn.addEventListener('click', function () {
                rateInput.value = DEFAULT_RATE;
                hoursInput.value = '';
                minutesInput.value = '';
                warningBanner.classList.add('hidden');
                calculate();
                hoursInput.focus();
            });

            // Run on load
            calculate();
        })();
    </script>
</body>
</html>
