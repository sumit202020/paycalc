<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Rate Calculator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.container {
  background: rgba(0,0,0,0.4);
  padding: 30px;
  border-radius: 15px;
  width: 350px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
h2 {
  text-align: center;
}
input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
  border: none;
  outline: none;
}
.result {
  margin-top: 10px;
  padding: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
}
button {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #ff6b6b;
  color: white;
  cursor: pointer;
  margin-top: 10px;
}
button:hover {
  background: #ff4757;
}
</style>
</head>
<body>
<div class="container">
  <h2>💰 Pay Calculator</h2>

  <label>Enter Pay Rate (per hour):</label>
  <input type="number" id="rate" placeholder="e.g. 2200" oninput="recalcAll()">

  <label>Enter Seconds:</label>
  <input type="number" id="seconds" placeholder="e.g. 62" oninput="calcSeconds()">
  <div class="result" id="secResult"></div>

  <label>Enter Time (MM.SS format):</label>
  <input type="text" id="minutes" placeholder="e.g. 12.30" oninput="calcMinutes()">
  <div class="result" id="minResult"></div>

  <button onclick="resetAll()">🔄 Reset</button>
</div>

<script>
function getRatePerSecond() {
  let rate = parseFloat(document.getElementById('rate').value);
  if (!rate) return 0;
  return rate / 3600;
}

function calcSeconds() {
  let secInput = document.getElementById('seconds');
  let sec = parseFloat(secInput.value);
  let ratePerSec = getRatePerSecond();

  if (secInput.value === "") {
    document.getElementById('secResult').innerHTML = "";
    return;
  }

  if (isNaN(sec)) return;

  let money = sec * ratePerSec;

  let minutes = Math.floor(sec / 60);
  let seconds = sec % 60;

  let formatted = minutes + "." + (seconds < 10 ? "0" : "") + seconds;

  document.getElementById('secResult').innerHTML = 
    `💵 Money: ₹${money.toFixed(2)} <br> ⏱ Time: ${formatted} (MM.SS)`;
}

function calcMinutes() {
  let inputField = document.getElementById('minutes');
  let input = inputField.value.trim();
  let ratePerSec = getRatePerSecond();

  if (input === "") {
    document.getElementById('minResult').innerHTML = "";
    return;
  }

  let min = 0;
  let sec = 0;

  // If only minutes given (e.g. 15)
  if (!input.includes('.')) {
    min = parseInt(input);
    sec = 0;
  } else {
    let parts = input.split('.');
    min = parseInt(parts[0]);
    sec = parseInt(parts[1]);
  }

  if (isNaN(min) || isNaN(sec)) return;

  let totalSeconds = (min * 60) + sec;
  let money = totalSeconds * ratePerSec;

  document.getElementById('minResult').innerHTML = 
    `💵 Money: ₹${money.toFixed(2)} <br> ⏱ Total Seconds: ${totalSeconds}`;
}

function recalcAll() {
  // Recalculate both sections when rate changes
  calcSeconds();
  calcMinutes();
}

function resetAll() {
  document.getElementById('rate').value = "";
  document.getElementById('seconds').value = "";
  document.getElementById('minutes').value = "";
  document.getElementById('secResult').innerHTML = "";
  document.getElementById('minResult').innerHTML = "";
}
</script>
</body>
</html>
